<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>SignalR Chat Demo</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; margin-bottom: 8px; }
        .message { margin: 4px 0; }
        .system { color: #888; font-style: italic; }
        input { padding: 6px; margin-right: 4px; }
        button { padding: 6px 12px; cursor: pointer; }
        #status { font-size: 12px; color: #888; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h2>SignalR Chat Demo</h2>
    <div id="status">連線中...</div>
    <div id="messages"></div>

    <input id="user" type="text" placeholder="你的名稱" value="User1" style="width:100px" />
    <input id="message" type="text" placeholder="輸入訊息..." style="width:300px" />
    <button onclick="sendMessage()">送出</button>

    <!-- SignalR JS Client（從 CDN 載入）-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script>
        // 透過 Gateway (port 5000) 連到 ChatHub
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("http://localhost:5000/hub/chat")
            .withAutomaticReconnect()
            .build();

        // 接收 Server 廣播過來的訊息
        connection.on("ReceiveMessage", (user, message) => {
            const div = document.getElementById("messages");
            const isSystem = user === "System";
            div.innerHTML += `<div class="message ${isSystem ? 'system' : ''}">
                <b>${user}</b>: ${message}
            </div>`;
            div.scrollTop = div.scrollHeight;
        });

        // 建立連線
        connection.start()
            .then(() => {
                document.getElementById("status").textContent = `已連線 (ID: ${connection.connectionId})`;
                document.getElementById("status").style.color = "green";
            })
            .catch(err => {
                document.getElementById("status").textContent = "連線失敗：" + err;
                document.getElementById("status").style.color = "red";
            });

        // 送出訊息
        function sendMessage() {
            const user = document.getElementById("user").value;
            const message = document.getElementById("message").value;
            if (!message) return;

            // 呼叫 Server 的 SendMessage 方法
            connection.invoke("SendMessage", user, message)
                .catch(err => console.error(err));

            document.getElementById("message").value = "";
        }

        // 按 Enter 送出
        document.getElementById("message").addEventListener("keypress", e => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>

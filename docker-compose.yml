services:

  # ── Gateway（唯一對外入口）─────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Demo.Gateway/Dockerfile
    environment:
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=demo-app
      - Jwt__Audience=demo-app
      - Otlp__Endpoint=http://jaeger:4317
    depends_on:
      - auth-service
      - data-service
      - realtime-service

  # ── AuthService ───────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: Demo.AuthService/Dockerfile
    environment:
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=demo-app
      - Jwt__Audience=demo-app
      - ConnectionStrings__AuthDb=Host=postgres;Database=auth_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Otlp__Endpoint=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy

  # ── DataService ───────────────────────────────────────────
  data-service:
    build:
      context: .
      dockerfile: Demo.DataService/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=demo_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMq__Host=rabbitmq
      - Otlp__Endpoint=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  # ── RealTime（SignalR）────────────────────────────────────
  realtime-service:
    build:
      context: .
      dockerfile: Demo.RealTime/Dockerfile
    environment:
      - Otlp__Endpoint=http://jaeger:4317
      - RabbitMq__Host=rabbitmq
    depends_on:
      - rabbitmq

  # ── GrpcService ───────────────────────────────────────────
  grpc-service:
    build:
      context: .
      dockerfile: Demo.GrpcService/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=grpc_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Otlp__Endpoint=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy

  # ── Worker（RabbitMQ Consumer）────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Demo.Worker/Dockerfile
    depends_on:
      - rabbitmq

  # ── TcpService ────────────────────────────────────────────
  tcp-service:
    build:
      context: .
      dockerfile: Demo.TcpService/Dockerfile

  # ── Prometheus（指標收集）─────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # ── Grafana（指標視覺化儀表板）────────────────────────────
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus

  # ── Jaeger（分散式追蹤可視化）────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── RabbitMQ ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management

volumes:
  postgres-data:
